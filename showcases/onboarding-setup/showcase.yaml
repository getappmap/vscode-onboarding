meta:
  title: Setting up appmap-java with Onboarding
  description: How an AI agent wrote the setup steps for appmap-java, and how the Onboarding panel runs them.
  loop: false
  notes: Cut from a 16-minute screen recording made on 2026-10-13 (no audio). The full recording is not committed; only the stills and two short clips are. The recording ends while the Oracle step is still pulling its image; the final all-ready screenshot was sent separately.
  pace: 2.92

scenes:
  - id: intro
    theme: statement
    title: A better way to onboard
    captions:
      - text: Agent skills and a VS Code extension get a new developer from clone to working setup.
    media:
      kind: image
      asset: all-ready
      alt: "The finished setup: all fourteen Onboarding steps Ready."
      frame: full
      fit: cover
      motion: zoom-in

  - id: how-it-works
    theme: console
    title: What Onboarding is
    captions:
      - text: Onboarding reads a file in the repo called onboarding.yaml, which lists each setup step.
    media: { kind: graphic, graphic: how-it-works, alt: "Diagram: onboarding.yaml lists steps; each step's check runs, a failing check runs its fix, and a passing check marks the step Ready." }

  - id: empty-panel
    theme: console
    title: Start with Draft Manifest
    captions:
      - text: To set up a new project, click "Draft Manifest".
      - text: It directs an agent to run the /onboarding-manifest-writer skill.
    media: { kind: image, asset: empty-panel, alt: "The empty Onboarding panel with a Draft Manifest button, and the chat starting /onboarding-manifest-writer.", motion: still }

  - id: agent-question
    theme: console
    title: The agent asks what it can't tell
    captions:
      - text: The agent analyzes project files, like the README, build files, and CI workflows.
      - text: When something is unclear, it asks you. Here, how should developers install Java 21?
    media: { kind: image, asset: agent-question, alt: "The agent asks which tool developers should use to get JDK 21, recommending mise.", motion: still }

  - id: manifest-drafted
    theme: console
    title: Nine setup steps
    captions:
      - text: A few minutes later, onboarding.yaml lists nine steps.
      - text: They cover everything from installing Java to building the sample apps that the tests need.
      - text: The agent also adds small helper scripts, and updates the README to match.
    media: { kind: image, asset: manifest-drafted, alt: "The Onboarding panel lists nine steps, all Not checked yet; the chat summarizes the files the agent changed.", motion: still }

  - id: step-detail
    theme: console
    title: Inside one step
    captions:
      - text: The developer can click a step to see how it works.
      - text: If a step fails, an agent can troubleshoot it. Notes in the onboarding file hold tips for making the repair.
    media: { kind: image, asset: step-detail, alt: "The detail page for the mise step: its check and fix commands, what to do if it fails, and notes from the team.", motion: still }

  - id: first-run
    theme: console
    title: Run setup
    durationMs: 12300
    captions:
      - text: Now we run the setup. The tool works down the list, checking each step and fixing the ones that fail.
        durationMs: 8300
      - text: A few seconds later, all nine steps are Ready.
        durationMs: 4000
    media: { kind: video, asset: clip-first-run, alt: "The setup runs through all nine steps until each one shows Ready." }

  - id: ask-podman
    theme: console
    title: Ask for more
    captions:
      - text: The agent had left out the Oracle database tests. So we ask it to include those.
      - text: And one twist. Run the database with Podman instead of Docker.
    media: { kind: image, asset: ask-podman, alt: "The chat shows the two requests: set up everything needed to run the project, and use Podman instead of Docker.", motion: still }

  - id: fourteen-steps
    theme: console
    title: Fourteen steps now
    captions:
      - text: The manifest grows to fourteen steps.
      - text: The new ones include Podman and the Oracle test database.
      - text: They show "Not checked yet". The old steps stay "Ready".
    media: { kind: image, asset: fourteen-steps, alt: "The Onboarding panel lists fourteen steps; the five new ones show Not checked yet.", motion: still }

  - id: second-run
    theme: console
    title: Run setup again
    durationMs: 9200
    captions:
      - text: We run the setup again. The old steps pass right away.
        durationMs: 4000
      - text: The new ones get fixed one by one, until it reaches the Oracle database.
        durationMs: 5200
    media: { kind: video, asset: clip-second-run, alt: "The second setup run passes the old steps quickly and starts fixing the new ones." }

  - id: oracle-step
    theme: console
    title: The Oracle database starts
    captions:
      - text: The Oracle step pulls a large container image and starts the database.
      - text: The agent warns that this Podman machine has only 2 GB of memory, which is about what Oracle needs.
    media: { kind: image, asset: oracle-step, alt: "The Oracle step is fixing: the Output panel shows the image being copied and 'Waiting for Oracle to accept connections'.", motion: still }
  - id: troubleshoot
    theme: console
    title: When a step fails, an agent troubleshoots
    note: Screenshot sent by the user after the recording ended.
    captions:
      - text: That warning was right. Oracle runs out of memory, so Onboarding hands the step to its troubleshooter agent.
      - text: The agent gives Podman 4 GB, runs the fix again, and writes what it learned into the notes for the next person.
      - text: All fourteen steps are now Ready.
    media:
      kind: image
      asset: all-ready
      alt: All fourteen steps show Ready. The chat shows the onboarding-troubleshooter agent's summary of how it fixed the Oracle step.
      motion: still

  - id: outro
    theme: statement
    title: Setup is now part of the repo
    captions:
      - text: All of this is now committed with the code.
      - text: The next developer just opens the repo, and runs setup.
    media:
      kind: graphic
      graphic: onboarding-icon
      alt: "The Onboarding extension's icon: a clipboard with a checked list."
      frame: mark
    cta: { label: View on GitHub, url: https://github.com/getappmap/vscode-onboarding, kind: github }
    ctaNote: github.com/getappmap/vscode-onboarding
